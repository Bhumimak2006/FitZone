<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator - FitZone</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        FIT<span>ZONE</span>
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="workouts.html">Workouts</a>
        <a href="membership.html">Membership</a>
        <a href="bmi.html">BMI</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>

    </nav>

</header>


<section class="page-header">

    <h1>BMI CALCULATOR</h1>

    <p>
        Check your Body Mass Index.
    </p>

</section>


<section class="calculator">

    <h2>Calculate Your BMI</h2>


    <label>
        Weight (kg)
    </label>

    <input type="number"
           id="weight"
           placeholder="Example: 60">


    <label>
        Height (meters)
    </label>

    <input type="number"
           id="height"
           step="0.01"
           placeholder="Example: 1.70">


    <button id="calculateBtn"
            class="btn">

        Calculate BMI

    </button>


    <div id="result"
         class="result">
    </div>

</section>


<section class="section">

    <h2 class="section-title">
        BMI CATEGORIES
    </h2>

    <table>

        <tr>
            <th>BMI</th>
            <th>Category</th>
        </tr>

        <tr>
            <td>Below 18.5</td>
            <td>Underweight</td>
        </tr>

        <tr>
            <td>18.5 - 24.9</td>
            <td>Normal</td>
        </tr>

        <tr>
            <td>25 - 29.9</td>
            <td>Overweight</td>
        </tr>

        <tr>
            <td>30+</td>
            <td>Obesity</td>
        </tr>

    </table>

</section>


<footer>

    <p>&copy; 2026 FitZone Gym</p>

</footer>


<script src="js/bmi.js"></script>

</body>
</html>
